version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /src/RevitDevLoader.Addin.Legacy
      - /src/RevitDevLoader.Addin.Modern
      - /src/RevitDevLoader.Core
      - /tests/RevitDevLoader.Core.Tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    labels: [dependencies, build]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: chore(deps)
