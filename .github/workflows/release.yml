name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Set release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw 'Release tag must use vMAJOR.MINOR.PATCH with optional prerelease or build metadata.'
          }
          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
      - name: Build all Revit years
        run: .\build\build-all.ps1 -SkipTests
      - name: Test core and release layout
        run: dotnet test tests/RevitDevLoader.Core.Tests -c Release
      - name: Package installer
        run: .\build\installer\package.ps1 -SkipBuild
      - name: Build installers
        run: .\build\installer\build-installers.ps1 -InstallIfMissing
      - name: Stage release assets and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $packages = @(Get-ChildItem -LiteralPath build/release/packages -Filter '*.zip' -File)
          $setups = @(Get-ChildItem -LiteralPath build/release/packages -Filter '*-setup.exe' -File)
          if ($packages.Count -ne 1 -or $setups.Count -ne 2) { throw 'Expected exactly one ZIP and two setup executables.' }
          $assetPath = Join-Path $packages[0].DirectoryName "revit-devloader-$version.zip"
          Move-Item -LiteralPath $packages[0].FullName -Destination $assetPath
          $assets = @($assetPath) + @($setups.FullName)
          $checksumPath = Join-Path $packages[0].DirectoryName 'SHA256SUMS.txt'
          $checksums = foreach ($asset in $assets | Sort-Object) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          Set-Content -LiteralPath $checksumPath -Value $checksums -Encoding ascii
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/release/packages/revit-devloader-${{ env.RELEASE_VERSION }}.zip
            build/release/packages/revit-devloader-${{ env.RELEASE_VERSION }}-user-setup.exe
            build/release/packages/revit-devloader-${{ env.RELEASE_VERSION }}-admin-setup.exe
            build/release/packages/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $assets = @(
            "build/release/packages/revit-devloader-$version.zip"
            "build/release/packages/revit-devloader-$version-user-setup.exe"
            "build/release/packages/revit-devloader-$version-admin-setup.exe"
          )
          $checksumPath = 'build/release/packages/SHA256SUMS.txt'
          $base = "https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG"
          $installNotes = @"
          <!-- devloader-install:start -->
          ## Install

          - [User setup]($base/revit-devloader-$version-user-setup.exe): current Windows account, no elevation.
          - [Admin setup]($base/revit-devloader-$version-admin-setup.exe): all users on the machine.
          - [ZIP with install.ps1]($base/revit-devloader-$version.zip): scripted installs.
          - [SHA256SUMS.txt]($base/SHA256SUMS.txt) covers every asset above.

          Close Revit before installing, then open **Add-Ins > DevLoader > Dev**.
          <!-- devloader-install:end -->
          "@
          $existingNotes = gh release view $env:RELEASE_TAG --json body --jq .body
          if ($LASTEXITCODE -eq 0) {
            # Replace only the generated install block when retrying a release.
            $notes = ($existingNotes -join "`n") -replace '(?s)<!-- devloader-install:start -->.*?<!-- devloader-install:end -->', ''
            Set-Content -LiteralPath release-notes.md -Value "$($notes.TrimEnd())`n`n$installNotes" -Encoding utf8
            & gh release upload $env:RELEASE_TAG @assets $checksumPath --clobber
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset upload failed.' }
            gh release edit $env:RELEASE_TAG --notes-file release-notes.md
          } else {
            Set-Content -LiteralPath release-notes.md -Value $installNotes -Encoding utf8
            $releaseArgs = @('release', 'create', $env:RELEASE_TAG) + $assets + @($checksumPath, '--verify-tag', '--notes-file', 'release-notes.md', '--generate-notes', '--title', "Revit DevLoader $version")
            if ($version -match '-') { $releaseArgs += '--prerelease' }
            & gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed.' }
      # Releases created with GITHUB_TOKEN do not trigger release workflows.
      - name: Dispatch WinGet manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh workflow run winget.yml --ref $env:RELEASE_TAG -f "tag=$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'WinGet workflow dispatch failed.' }
