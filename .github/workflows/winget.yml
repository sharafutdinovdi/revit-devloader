# WINGET_TOKEN is a maintainer-owned classic PAT with the public_repo scope.
name: WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  manifests:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw 'Expected a vMAJOR.MINOR.PATCH release tag.'
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          $metadata = gh release view $env:RELEASE_TAG --json isPrerelease,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release metadata.' }
          if ($metadata.isDraft) { throw 'The release must be published.' }
          "prerelease=$($metadata.isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Generate WinGet manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .\build\winget\New-WingetManifests.ps1 -Version $env:RELEASE_VERSION -ReleaseTag $env:RELEASE_TAG -OutputDir build/release/winget
      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WinGet-manifests
          path: build/release/winget/manifests/
          if-no-files-found: error
      - name: Submit to WinGet
        if: env.WINGET_TOKEN != '' && steps.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $wingetcreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile $wingetcreate
          $signature = Get-AuthenticodeSignature -LiteralPath $wingetcreate
          if ($signature.Status -ne 'Valid') { throw "Invalid wingetcreate Authenticode signature: $($signature.Status)" }
          & $wingetcreate submit "build/release/winget/manifests/s/Sharafutdinov/RevitDevLoader/$env:RELEASE_VERSION" --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed.' }
