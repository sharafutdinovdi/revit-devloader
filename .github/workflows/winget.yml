# WINGET_TOKEN is a maintainer-owned classic PAT with the public_repo scope.
name: WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  manifests:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw 'Expected a vMAJOR.MINOR.PATCH release tag.'
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          $metadata = gh release view $env:RELEASE_TAG --json isPrerelease,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release metadata.' }
          if ($metadata.isDraft) { throw 'The release must be published.' }
          "prerelease=$($metadata.isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Generate WinGet manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .\build\winget\New-WingetManifests.ps1 -Version $env:RELEASE_VERSION -ReleaseTag $env:RELEASE_TAG -OutputDir build/release/winget
      - name: Validate and test the manifest
        id: install_test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "build/release/winget/manifests/s/Sharafutdinov/RevitDevLoader/$env:RELEASE_VERSION"
          winget --version
          $output = winget validate --manifest $dir --disable-interactivity 2>&1 | Out-String
          Write-Host $output
          # winget exits non-zero for "succeeded with warnings"; only a hard failure must fail the job.
          if ($output -notmatch 'Manifest validation succeeded') { throw 'WinGet validation failed' }
          winget settings --enable LocalManifestFiles | Out-String | Write-Host
          # winget can hang on hosted runners; bound the install so the job never waits for hours.
          $tested = 'false'
          $log = "$env:RUNNER_TEMP/winget-install.txt"
          $proc = Start-Process winget -ArgumentList @('install', '--manifest', $dir, '--scope', 'user', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity') -RedirectStandardOutput $log -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(300000)) {
            $proc.Kill()
            Write-Host '::warning::winget install --manifest did not finish within 5 minutes on the hosted runner; skipping the install test.'
          } elseif ($proc.ExitCode -ne 0) {
            Get-Content $log | Write-Host
            Write-Host "::warning::winget install --manifest exited with $($proc.ExitCode); skipping the install test."
          } else {
            Get-Content $log | Write-Host
            $manifest = Get-ChildItem "$env:APPDATA/Autodesk/Revit/Addins" -Recurse -Filter 'RevitDevLoader.addin' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $manifest) { throw 'winget install reported success but RevitDevLoader.addin is missing' }
            Write-Host "ASSERT: installed $($manifest.FullName)"
            winget uninstall --id Sharafutdinov.RevitDevLoader --disable-interactivity 2>&1 | Out-String | Write-Host
            if (Test-Path $manifest.FullName) { throw 'manifest remains after winget uninstall' }
            Write-Host 'ASSERT: winget uninstall removed the add-in'
            $tested = 'true'
          }
          "install_tested=$tested" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WinGet-manifests
          path: build/release/winget/manifests/
          if-no-files-found: error
      - name: Submit to WinGet
        if: env.WINGET_TOKEN != '' && steps.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          INSTALL_TESTED: ${{ steps.install_test.outputs.install_tested }}
        run: |
          $ErrorActionPreference = 'Stop'
          $wingetcreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile $wingetcreate
          $signature = Get-AuthenticodeSignature -LiteralPath $wingetcreate
          if ($signature.Status -ne 'Valid') { throw "Invalid wingetcreate Authenticode signature: $($signature.Status)" }
          $submitLog = Join-Path $env:RUNNER_TEMP 'wingetcreate-submit.txt'
          & $wingetcreate submit "build/release/winget/manifests/s/Sharafutdinov/RevitDevLoader/$env:RELEASE_VERSION" --token $env:WINGET_TOKEN 2>&1 | Tee-Object -FilePath $submitLog | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed.' }
          $prUrl = (Select-String -Path $submitLog -Pattern 'https://github.com/microsoft/winget-pkgs/pull/\d+' -AllMatches).Matches.Value | Select-Object -Last 1
          if (-not $prUrl) { throw 'wingetcreate did not print a pull request URL.' }
          # wingetcreate submits the PR template unfilled; complete it with what this workflow verified.
          if ($env:INSTALL_TESTED -eq 'true') {
            $installLine = '- [x] Tested manifest locally with ``winget install --manifest <path>`` (installed and uninstalled in the release workflow on windows-latest; the project CI also runs silent install and uninstall smoke tests)'
          } else {
            $installLine = '- [ ] Tested manifest locally with ``winget install --manifest <path>`` (winget did not complete on the hosted runner; the installers pass silent install and uninstall smoke tests in the project CI)'
          }
          $body = @"
          ## 📖 Description

          Revit DevLoader $env:RELEASE_VERSION, an MIT-licensed add-in for Autodesk Revit 2022-2026 that installs versioned test plugins from a feed. User and admin Inno Setup installers from https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG. Submitted by the project's release workflow.

          ## ✅ Checklist

          - [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)
          - [ ] Linked to an issue (if applicable)

          ## 📦 Manifest Checklist

          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated manifest locally with ``winget validate --manifest <path>`` (in the release workflow on windows-latest)
          $installLine
          - [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)
          "@
          $env:GH_TOKEN = $env:WINGET_TOKEN
          gh pr edit $prUrl --body $body
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the WinGet pull request body.' }
          Write-Host "WinGet PR: $prUrl"
