name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [PR checks]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci.yml

  quality:
    name: pr-checks
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Conventional Commit title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check workflows with actionlint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_windows_amd64.zip --dir "$env:RUNNER_TEMP/actionlint"
          if ($LASTEXITCODE -ne 0) { throw 'actionlint download failed' }
          Expand-Archive "$env:RUNNER_TEMP/actionlint/actionlint_1.7.12_windows_amd64.zip" "$env:RUNNER_TEMP/actionlint/bin"
          & "$env:RUNNER_TEMP/actionlint/bin/actionlint.exe"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Verify C# formatting
        env:
          DeployAddin: 'false'
        run: dotnet format RevitDevLoader.sln --verify-no-changes --verbosity minimal

  artifact-comment:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: artifact-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Update build artifact comment
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            // Fork runs can omit pull_requests; resolve the association through the API.
            const pulls = run.pull_requests?.length ? run.pull_requests :
              await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...repo, commit_sha: run.head_sha, per_page: 100
              });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo, run_id: run.id, per_page: 100
            });
            const builds = [
              ['Legacy', 'Legacy add-ins: Revit 2022, 2023, 2024 (net48)'],
              ['Modern', 'Modern add-ins: Revit 2025, 2026 (net8)'],
              ['Installer', 'Installer ZIP: Revit 2022–2026']
            ];
            const links = builds.map(([name, label]) => {
              const artifact = artifacts.find(item => item.name === name && !item.expired);
              if (!artifact) throw new Error(`Missing artifact: ${name}`);
              return `- [${label}](${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}/artifacts/${artifact.id})`;
            });
            const marker = '<!-- addin-build-artifacts -->';
            const body = [marker, 'Builds and tests passed for Revit 2022–2026.', '',
              ...links, '', `Commit: \`${run.head_sha}\`. Sign in to GitHub to download; artifacts expire after 90 days.`].join('\n');
            for (const candidate of pulls) {
              const { data: pr } = await github.rest.pulls.get({...repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.base.repo.full_name !== `${repo.owner}/${repo.repo}` ||
                  pr.head.sha !== run.head_sha) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pr.number, per_page: 100
              });
              const previous = comments.find(item => item.user.login === 'github-actions[bot]' &&
                item.body.includes(marker));
              if (previous) {
                await github.rest.issues.updateComment({...repo, comment_id: previous.id, body});
              } else {
                await github.rest.issues.createComment({...repo, issue_number: pr.number, body});
              }
            }

  explain-failure:
    needs: [ci, quality]
    if: >-
      failure() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      pull-requests: write
    uses: sharafutdinovdi/.github/.github/workflows/check-failure-comment.yml@main
    with:
      step-commands: >-
        {"Check Conventional Commit title":"gh pr edit ${{ github.event.pull_request.number }} --title \"ci: adopt shared workflows and add pre-commit\"",
         "Check workflows with actionlint":"actionlint",
         "Verify C# formatting":"dotnet format RevitDevLoader.sln --verify-no-changes",
         "Build documentation":"mkdocs build --strict"}
    secrets: inherit
